<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Rush</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b15;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 80px 20px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #bbbbcc;
      margin-bottom: 40px;
    }

    .card {
      background: #171725;
      padding: 30px;
      border-radius: 16px;
      margin-top: 30px;
    }

    a {
      color: #8b8bff;
      text-decoration: none;
    }

    .button {
      display: inline-block;
      margin: 10px;
      padding: 14px 24px;
      border-radius: 10px;
      background: #665cff;
      color: white;
      font-weight: bold;
    }

    footer {
      margin-top: 60px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Escape Rush</h1>

  <div class="subtitle">
    Escape. Survive. Keep moving.
  </div>

  <div class="card">
    <h2>Welcome to Escape Rush</h2>

    <p>
      Escape Rush is a fast-paced mobile game available on Android.
    </p>

    <a class="button" href="privacy.html">
      Privacy Policy
    </a>
  </div>

  <div class="card">
    <h2>Support</h2>

    <p>
      For support, please use the contact information available on our
      Google Play Store listing.
    </p>
  </div>

  <footer>
    © 2026 Escape Rush. All rights reserved.
  </footer>

</div>

</body>
</html>
